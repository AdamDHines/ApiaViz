[workspace]
name = "ApiaViz"
version = "1.0.0"
description = "Modelling of honeybee vision"
authors = ["Adam D Hines <adam.hines@qut.edu.au>, Karin Nordstrom, Andrew Barron"]
channels = ["conda-forge", "pytorch"]
platforms = ["linux-64", "osx-arm64", "win-64"]
preview = ["pixi-build"]

[environments]
cuda = ["cuda"]

[tasks]
# --- Evaluation: downstream tasks (each prints a clean summary table) ---
flowers = {cmd = "python main.py -d 17flowers"}
nav = {cmd = "python main.py -d nav"}

# --- Open-loop navigation suites (untrained backbone, corridor memory, colour-landmark world) ---
freenav = {cmd = "python apiaviz/nav/run_mbon_openloop_core_suite_standalone.py --device auto"}
ablation = {cmd = "python apiaviz/nav/run_mbon_openloop_ablation_suite_standalone.py --device auto"}
diagnostics = {cmd = "python apiaviz/nav/run_mbon_openloop_diagnostics_standalone.py --device auto"}

# --- Presentation figures (mean +/- SEM bars + scan animations) from existing outputs; no reruns ---
figures = {cmd = "python paper/make_presentation_summary_assets.py"}

[dependencies]
python = "*"
numpy = "==1.26.4,<2"
pytorch = "*"
torchvision = "*"
tqdm = "*"
opencv = "*"
matplotlib-base = "*" 
scikit-learn = "*"
scikit-image = "*"
pandas = "*"
pyarrow = "*"

[feature.cuda]
platforms = ["linux-64"]
system-requirements = {cuda = "12"}

[feature.cuda.dependencies]
cuda-version = "12.*"
pytorch-gpu = "*"
cuda-cudart-dev = "*"
cuda-crt = "*"
cudnn = "*"
libcusparse-dev = "*"
cuda-driver-dev = "*"
cuda-nvcc = "*"
cuda-nvrtc-dev = "*"
cuda-nvtx-dev = "*"
cuda-nvml-dev = "*"
cuda-profiler-api = "*"
cusparselt = "*"
libcublas-dev = "*"
libcudss-dev = "*"
libcufile-dev = "*"
libcufft-dev = "*"
libcurand-dev = "*"
libcusolver-dev = "*"
